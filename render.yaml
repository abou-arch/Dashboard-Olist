# Déploiement sur Render (https://render.com) : « New » > « Blueprint », puis ce dépôt.
services:
  - type: web
    name: dashboard-olist
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/meta
    # Ne déploie un nouveau commit de main que si les vérifications GitHub
    # (tests, compilation, audit des dépendances) sont passées.
    autoDeployTrigger: checksPass
